name: "Main"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web-app: ${{ steps.filter.outputs.web-app }}
      helm-libraries: ${{ steps.filter.outputs.helm-libraries }}
      terraform: ${{ steps.changes.outputs.terraform }}
      lambda: ${{ steps.changes.outputs.lambda }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: Actions/checkout@v6
        with:
          persist-credentials: true

      - name: Get Paths
        id: paths
        run: ./.github/scripts/get-paths.sh | tee -a "$GITHUB_OUTPUT"

      - name: Path Check
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: ${{ steps.paths.outputs.paths }}

      - name: Output Changes
        id: changes
        run: ./.github/scripts/output-changes.sh ${{ join(fromJson(steps.filter.outputs.changes), ' ') }} | tee -a "$GITHUB_OUTPUT"

  terraform:
    needs: [changes]
    # The second clause guards the case where cloudflare is the *only* changed module:
    # the exclude below would then empty the matrix, and an empty matrix is a worse
    # failure mode than simply not running the job.
    if: needs.changes.outputs.terraform != '[]' && needs.changes.outputs.terraform != '["cloudflare"]'
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1
      matrix:
        application: ${{ fromJson(needs.changes.outputs.terraform) }}
        # terraform/cloudflare keeps its state in R2 and touches no AWS, so it cannot use
        # this AWS-shaped workflow. It runs via terraform-cloudflare below.
        exclude:
          - application: cloudflare
    uses: ./.github/workflows/terraform.yaml
    with:
      application: ${{ matrix.application }}

  terraform-cloudflare:
    needs: [changes]
    if: contains(fromJson(needs.changes.outputs.terraform), 'cloudflare')
    permissions:
      contents: read
    uses: ./.github/workflows/terraform-cloudflare.yaml
    # Declared explicitly rather than `inherit`: this workflow needs three secrets, and
    # `inherit` would hand it every secret in the repository.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  test-lambda:
    needs: [changes]
    if: needs.changes.outputs.lambda != '[]'
    permissions:
      contents: read
    strategy:
      matrix:
        lambda: ${{ fromJson(needs.changes.outputs.lambda) }}
    uses: ./.github/workflows/test-lambda.yaml
    with:
      lambda: ${{ matrix.lambda }}

  build:
    needs: [changes, terraform]
    uses: ./.github/workflows/build-image.yaml
    if: always() && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') && needs.changes.outputs.web-app == 'true'
    permissions:
      contents: read
      id-token: write
    with:
      application: web-app
      push: true

  deploy-worker:
    needs: [changes, terraform-cloudflare]
    uses: ./.github/workflows/deploy-worker.yaml
    if: always() && (needs.terraform-cloudflare.result == 'success' || needs.terraform-cloudflare.result == 'skipped') && needs.changes.outputs.web-app == 'true'
    permissions:
      contents: read
    with:
      # Pull requests build and dry-run only; uploads happen on main.
      deploy: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  helm-libraries:
    needs: [changes]
    if: ${{ needs.changes.outputs.helm-libraries == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: Actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            helm-libraries

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::537239034666:role/github_oidc_role
          aws-region: "ap-southeast-2"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Package & Push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          helm package helm-libraries/common-library/ -d helm-libraries/
          # Not require for OCI registries
          # helm repo index helm-libraries --url "${ECR_REGISTRY}/yeahboi/helm-libraries/"
          helm push helm-libraries/common-library-*.tgz "oci://${ECR_REGISTRY}/yeahboi/helm-libraries/"
